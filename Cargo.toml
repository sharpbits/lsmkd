[package]
name = "lsmkd"
description = "Recursively find markdown files and list them along with table of contents index"
license = "MIT"
version = "0.0.3"
authors = ["Ken Hill <ken@sharpbits.io>"]
edition = "2024"
repository = "https://github.com/sharpbits/lsmkd"
rust-version = "1.92.0"
exclude = [
    ".github",
    "assets",
    "benches",
    "helpers",
    "tests",
    ".gitignore",
    "*.nix",
    ".pre-commit*",
    "flake.lock",
    "Makefile",
    "AGENTS.md",
    "ci/*"
]

[[bin]]
name = "lsmkd"
path = "src/lsmkd.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"